services:

  # ---------------- NGINX ----------------
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro

    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

    networks:
      - secops-network

  # ---------------- BACKEND ----------------
  backend:
    build: ./backend
    container_name: backend
    restart: always

    ports:
      - "4000:4000"

    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=256"
      CLIENT_URL: "http://localhost"

    depends_on:
      ml-service:
        condition: service_started

    networks:
      - secops-network

  # ---------------- FRONTEND ----------------
  frontend:
    build: ./frontend
    container_name: frontend
    restart: always

    ports:
      - "5173:5173"

    environment:
      VITE_API_URL: ""

    depends_on:
      - backend

    networks:
      - secops-network

  # ---------------- ML SERVICE ----------------
  ml-service:
    build: ./ml-service
    container_name: ml-service
    restart: always

    ports:
      - "5001:5001"

    networks:
      - secops-network

  # ---------------- OWASP ZAP (LOW MEMORY MODE) ----------------
  zap:
    image: zaproxy/zap-stable
    container_name: zap
    restart: always

    ports:
      - "8090:8090"

    env_file:
      - .env

    environment:
      ZAP_API_KEY: ${ZAP_API_KEY}
      JAVA_OPTS: "-Xmx512m"

    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8090 -config api.disablekey=false -config api.key=${ZAP_API_KEY}

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8090/" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - secops-network
    # ---------------- NETWORK ----------------
networks:
  secops-network:
    driver: bridge
