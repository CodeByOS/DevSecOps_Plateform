services:

  # ---------------- NGINX ----------------
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

    networks:
      - secops-network

    deploy:
      resources:
        limits:
          memory: 64M

  # ---------------- BACKEND ----------------
  backend:
    build: ./backend
    container_name: backend
    restart: always

    # Only expose internally — Nginx proxies externally
    expose:
      - "4000"

    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=512"
      CLIENT_URL: "http://158.158.1.116"
      FRONTEND_URL: "http://158.158.1.116"
      # Tell services that Docker-based scanners are disabled
      ML_SERVICE_URL: "http://ml-service:5001"

    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:4000/health" ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

    depends_on:
      ml-service:
        condition: service_healthy

    networks:
      - secops-network

    deploy:
      resources:
        limits:
          memory: 768M

  # ---------------- FRONTEND ----------------
  frontend:
    build: ./frontend
    container_name: frontend
    restart: always

    # Do NOT expose 5173 publicly — Nginx handles it
    expose:
      - "5173"

    environment:
      VITE_API_URL: ""

    depends_on:
      - backend

    networks:
      - secops-network

    deploy:
      resources:
        limits:
          memory: 256M

  # ---------------- ML SERVICE ----------------
  ml-service:
    build: ./ml-service
    container_name: ml-service
    restart: always

    expose:
      - "5001"

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5001/health" ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

    networks:
      - secops-network

    deploy:
      resources:
        limits:
          memory: 512M

# ---------------- NETWORK ----------------
networks:
  secops-network:
    driver: bridge
