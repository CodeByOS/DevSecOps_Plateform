# Redirect all HTTP traffic to HTTPS
server {
  listen 80;
  server_name os-secops.software www.os-secops.software;
  return 301 https://$host$request_uri;
}

# The Secure HTTPS Server
server {
  listen 443 ssl;
  server_name os-secops.software www.os-secops.software;

  # Point to the Let's Encrypt certificates
  ssl_certificate /etc/letsencrypt/live/os-secops.software/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/os-secops.software/privkey.pem;

  # Frontend
  location / {
    proxy_pass http://frontend:5173;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Backend API
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # WebSocket support
  location /socket.io/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # Health check
  location /health {
    proxy_pass http://backend:4000/health;
  }
}